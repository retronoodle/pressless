defaults:
    app:
        name: Stead
        environment: production
        debug: false
        # Opt-in override for `bin/migrate --fresh` and `bin/serve --fresh` outside
        # a development environment. The reset path drops every known application
        # table, so it is refused unless this flag is true. Set explicitly per
        # deployment when the operator understands the consequences.
        allow_reset: false
        # Same opt-in for the idempotent sample seeder, which writes a development
        # administrator and creates empty sample collections.
        allow_seed: false
        key: ~
        url: http://localhost:8000
    database:
        connection: mysql
        host: 127.0.0.1
        port: 3306
        database: stead
        username: stead
        password: ~
        charset: utf8mb4
        collation: utf8mb4_unicode_ci
        prefix: ''
    paths:
        project_root: .
        migrations: database/migrations
        seed: database/seed
        templates: templates
        cache: var/cache
        log: var/log
        storage: storage/media
        # When `theme.active` is set, theme templates resolve from
        # `themes/<active>/` ahead of the default `templates/` directory.
        # Leave `theme.active` empty to use the default templates only.
        theme: themes
    theme:
        active: starter
        # Maximum theme ZIP upload size in bytes. Defaults to 10 MiB.
        max_zip_bytes: 10485760
    sessions:
        name: stead_session
        lifetime: 7200
        cookie_secure: false
        cookie_httponly: true
        cookie_samesite: Lax
    media:
        # Maximum upload size in bytes. Defaults to 10 MiB.
        max_size_bytes: 10485760
    content:
        # Maximum number of revisions retained per entry. Each save of an
        # existing entry writes a pre-save snapshot; once this many are on
        # record, the oldest are pruned inside the same save transaction.
        revision_retention_limit: 20
    mail:
        # Default From address used when one isn't carried on the message.
        # Override via MAIL_FROM_EMAIL / MAIL_FROM_NAME in `.env`.
        from_email: admin@localhost
        from_name: Stead
    logging:
        level: info
        file: stead.log
    serve:
        host: 127.0.0.1
        port: 8000
    login:
        # Login attempt throttling. See src/Auth/LoginThrottle.
        # After max_attempts failures within window_seconds, further attempts
        # for the matching email or IP are rejected. Repeated lockouts
        # escalate via exponential backoff, capped at lockout_max_seconds.
        max_attempts: 5
        window_seconds: 900
        lockout_base_seconds: 60
        lockout_max_seconds: 3600
    update:
        # GitHub repository to check for updates, in `owner/repo` form.
        # The update checker queries
        # https://api.github.com/repos/<owner>/<repo>/releases/latest
        # and parses GitHub's release JSON (`tag_name`, `assets[]`,
        # `zipball_url`). Leave empty to disable update checks entirely
        # (the admin UI will silently not show any update notice). See
        # src/Update/. Override via UPDATE_GITHUB_REPO in `.env`.
        github_repo: ''
        # Base URL for the GitHub-style release API. Defaults to GitHub
        # itself and exists as an override for tests/local development;
        # production installs should leave this empty.
        api_base_url: ''
        # How often the update checker re-queries the endpoint, in hours.
        # Within this window the cached result is reused without making a
        # network call. The check piggybacks on admin page loads, not a
        # background process, so the value matters more for politeness
        # toward the website than for CPU.
        check_interval_hours: 24
        # Hard timeout for the endpoint HTTP call, in seconds. The checker
        # fails closed on timeout (treated as "no update", logged, no
        # admin-facing error).
        timeout_seconds: 5
    backups:
        # Storage target for backups: "local" (filesystem, default) or
        # "s3" (S3-compatible remote bucket).
        target: local
        # For target=local: directory backups are written to. Must be
        # outside the public web root. Default lives in var/backups.
        local_path: var/backups
        # For target=s3: connection details. Endpoint, bucket, region,
        # key, and secret are sourced via BACKUPS_S3_* env vars so
        # credentials never live in version-controlled YAML.
        s3:
            endpoint: ''
            bucket: ''
            region: us-east-1
            key: ''
            secret: ''
            # Optional: "virtual-host" (bucket.example.com) or "path"
            # (example.com/bucket). Most S3-compatible providers want
            # "path" with custom endpoints (MinIO default), while AWS
            # itself works with either.
            addressing_style: path
        # Number of most-recent successful backups to keep per target.
        # Older backups are pruned automatically after each successful run.
        retention_count: 7
        # How often (in hours) a scheduled backup is allowed to run.
        # The operator's cron entry drives timing; bin/backup --scheduled
        # compares this to the last successful backup's timestamp.
        # 24 = at most one backup per day; set to 0 to disable scheduling.
        frequency_hours: 24

development:
    app:
        environment: development
        debug: true
    database:
        connection: sqlite
        database: var/stead.sqlite
    logging:
        level: debug

production:
    app:
        environment: production
        debug: false
    sessions:
        cookie_secure: true
