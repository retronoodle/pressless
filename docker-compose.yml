# A prod-parity local environment for exercising the Stead web installer.
#
# Brings up PHP + MySQL + nginx on a single host network so a fresh checkout
# can be installed against real MySQL instead of only the dev-mode SQLite
# path. Not used by `bin/serve` or any other runtime path — installer only.
#
# Quick start:
#   docker compose up -d
#   open http://localhost:8080
#   ...walk through /install against the MySQL service below.

services:
  php:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - php-data:/var/www/html/var
    environment:
      APP_ENV: production

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stead
      MYSQL_USER: stead
      MYSQL_PASSWORD: stead
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
      - mysql
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  php-data:
  mysql-data: