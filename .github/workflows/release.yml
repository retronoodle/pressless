# Stead tagged-release pipeline
#
# Builds a production-only dist ZIP on a `vX.Y.Z` tag push and publishes it
# to the project website's release/download endpoint. Non-release tag or
# branch pushes are intentionally ignored — there is no other work this
# workflow does, so the `on.push.tags` filter is the entire gate.
#
# Required repository secrets (documented here so a maintainer can rotate
# them without reading the workflow logic):
#   - RELEASE_PUBLISH_URL : the full URL of the website's release upload
#                           endpoint (HTTPS, accepts POST with
#                           `version` and `file` form fields).
#   - RELEASE_PUBLISH_TOKEN : bearer token (or other shared secret) used in
#                             an `Authorization: Bearer ...` header to
#                             authenticate the publish call.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl
          coverage: none

      - name: Install Composer
        uses: composer/composer-action@v1
        with:
        # No `composer install` here on purpose: bin/release shells out to
        # composer itself in its own clean temp directory, so the host
        # environment does not need a pre-populated vendor/ tree.

      - name: Build release ZIP
        env:
          # bin/release uses $APP_ENV (defaulting to production) for nothing
          # meaningful today, but pinning it keeps the run hermetic.
          APP_ENV: production
        run: php bin/release "${GITHUB_REF_NAME#v}"

      - name: Publish ZIP to website release endpoint
        env:
          RELEASE_PUBLISH_URL: ${{ secrets.RELEASE_PUBLISH_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="stead-${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Expected $ZIP to exist after build step, but it does not." >&2
            exit 1
          fi
          if [ -z "${RELEASE_PUBLISH_URL:-}" ]; then
            echo "RELEASE_PUBLISH_URL secret is not configured." >&2
            exit 1
          fi
          if [ -z "${RELEASE_PUBLISH_TOKEN:-}" ]; then
            echo "RELEASE_PUBLISH_TOKEN secret is not configured." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${RELEASE_PUBLISH_TOKEN}" \
            --form "version=${VERSION}" \
            --form "file=@${ZIP}" \
            "${RELEASE_PUBLISH_URL}"

      - name: Upload build artefact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: stead-release-zip
          path: stead-*.zip
          if-no-files-found: error
          retention-days: 14
