# Stead tagged-release pipeline
#
# Builds a production-only dist ZIP on a `vX.Y.Z` tag push and publishes
# it as a GitHub Release with the ZIP attached as a release asset.
# Non-release tag or branch pushes are intentionally ignored — there is
# no other work this workflow does, so the `on.push.tags` filter is
# the entire gate.
#
# No repo secrets are required: `gh release create` authenticates with
# the Actions-provided `GITHUB_TOKEN`.
#
# Note: the previous version of this workflow published the ZIP to a
# custom website endpoint using the repo secrets RELEASE_PUBLISH_URL
# and RELEASE_PUBLISH_TOKEN. Those secrets are no longer referenced and
# may be deleted from the repository settings.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, intl
          coverage: none

      # This installs deps for the checkout the workflow runs from, so
      # `php bin/release` itself has an autoloader. bin/release then shells
      # out to composer again in its own clean temp directory to assemble
      # the production-only dependency set that ships in the dist ZIP.
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Build release ZIP
        env:
          # bin/release uses $APP_ENV (defaulting to production) for nothing
          # meaningful today, but pinning it keeps the run hermetic.
          APP_ENV: production
        run: php bin/release "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="stead-${VERSION}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Expected $ZIP to exist after build step, but it does not." >&2
            exit 1
          fi
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --generate-notes

      - name: Upload build artefact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: stead-release-zip
          path: stead-*.zip
          if-no-files-found: error
          retention-days: 14